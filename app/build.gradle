plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'nl.rogro82.pipup'
    compileSdk 35

    defaultConfig {
        applicationId "nl.rogro82.pipup"
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName "0.2.0-modern"
    }

    // A fixed, non-secret debug key committed to the repo, so every automatic build is
    // signed the same way and new versions install over old ones without uninstalling.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        // Android TV app: don't fail CI builds on lint warnings
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Image loading (image popups)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Video playback with RTSP support (camera streams)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // Embedded HTTP server
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
